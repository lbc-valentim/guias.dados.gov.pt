name: Validar arquitectura v1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/v1-single-source-agora
    paths:
      - "content/**"
      - "src/**"
      - "scripts/v1/**"
      - "scripts/generate_pdf_guides.py"
      - "assets/brand/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/v1-ci.yml"

concurrency:
  group: v1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validar integridade do histórico preservado
        run: python scripts/v1/restore-source-history.py
      - name: Instalar dependências de forma reproduzível
        run: npm ci --no-audit --no-fund
      - name: Validar fonte única e contrato de URLs
        run: |
          npm run content:validate
          npm run routes:check
      - name: Validar fronteiras da arquitectura
        run: npx tsx scripts/v1/check-architecture.ts
      - name: Validar mapper e segurança Squidex provisório
        run: npm run test:squidex
      - name: Validar fonte configurada com default local
        run: npm run content:source:check
      - name: Validar dry run de migração Squidex
        run: |
          npm run squidex:import:dry-run
          cat .build/squidex-import-report.json
      - name: Validar preflight da futura importação Squidex
        run: |
          npm run squidex:import:preflight
          cat .build/squidex-import-preflight.json
      - name: Validar concorrência e prontidão operacional Squidex
        run: |
          npm run squidex:import:safety-check
          cat .build/squidex-import-safety-check.json
      - name: Gerar artefactos derivados
        run: npm run content:derive
      - name: Typecheck
        run: npm run typecheck
      - name: Preparar dependências PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==68.0" "pypdf==5.9.0" "qrcode[pil]"
      - name: Gerar e validar 15 PDFs da fonte única
        run: bash scripts/v1/build-pdfs.sh
      - name: Static export
        env:
          NEXT_PUBLIC_BASE_PATH: /guias.dados.gov.pt
        run: npm run build
      - name: Validar CSS Ágora 4 e Tailwind 4
        run: npx tsx scripts/v1/check-tailwind-output.ts

      - name: Confirmar saída estática
        run: |
          test -f out/Guias-do-utilizador/index.html
          test -f out/search-index.json
          test -f out/sitemap.xml
          test "$(find out/assets/pdf -name '*.pdf' | wc -l)" -eq 15
          count=$(find out/Guias-do-utilizador -name index.html | wc -l)
          test "$count" -eq 119
          echo "Static export v1: $count rotas dos Guias."
      - name: Validar estrutura e coerência do static export
        run: npx tsx scripts/v1/check-export.ts
      - name: Preparar site para testes UX
        run: npm run test:site:prepare
      - name: Instalar Chromium para testes UX
        run: npx playwright install --with-deps chromium
      - name: Validar contrato UX responsivo
        run: npx playwright test tests/e2e/ux-contract.spec.ts
